name: Deployment

on:
  push:
    branches: [master]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      RUNNER_TRACKING_ID: ''
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Stop old containers
        run: |
          git reset --hard
          podman-compose -f docker-compose.yml down --remove-orphans || true
          podman rm -f laravel-app || true
          podman network rm main-laravel-vue_default || true

      - name: Build frontend assets
        run: npm run build

      - name: Build and start services
        run: |
          podman image exists laravel-php-base:8.5-pgsql-v1 || podman build -f Dockerfile.base -t laravel-php-base:8.5-pgsql-v1 .
          podman rm -f laravel-app || true
          podman-compose -f docker-compose.yml --podman-build-args="--squash" up --build -d

      - name: Cleanup old images
        run: |
          podman container prune -f || true
          podman image prune -f || true
