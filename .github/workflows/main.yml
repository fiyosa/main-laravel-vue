name: Deployment

on:
  push:
    branches: [master]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Stop old containers
        run: |
          podman-compose -f docker-compose.auto.yml down --remove-orphans || true
          podman-compose down --remove-orphans || true

      - name: Build frontend assets
        run: npm run build

      - name: Build and start services
        run: |
          cp .dockerignore.auto .dockerignore
          podman-compose -f docker-compose.auto.yml up --build -d

      - name: Wait for app healthy
        run: |
          for i in $(seq 1 30); do
            if podman-compose -f docker-compose.auto.yml ps app | grep -q "(healthy)"; then exit 0; fi
            sleep 5
          done
          podman-compose -f docker-compose.auto.yml logs app
          exit 1

      - name: Cleanup old images
        run: podman image prune -f
