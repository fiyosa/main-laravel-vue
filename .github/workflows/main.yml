name: Deployment

on:
  push:
    branches: [master]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Stop old containers
        run: |
          git reset --hard
          podman rm -f laravel-app || true
          podman-compose -f docker-compose.auto.yml down --remove-orphans || true

      - name: Build frontend assets
        run: npm run build

      - name: Build and start services
        run: |
          cp .dockerignore.auto .dockerignore
          podman image exists laravel-php-base:8.5-pgsql-v1 || podman build -f Dockerfile.base -t laravel-php-base:8.5-pgsql-v1 .
          podman rm -f laravel-app || true
          podman-compose -f docker-compose.auto.yml up --build -d

      - name: Cleanup old images
        run: |
          git reset --hard
          podman image prune -f
