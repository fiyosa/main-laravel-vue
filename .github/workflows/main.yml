name: Deployment

on:
  push:
    branches: [master]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Stop old containers
        run: |
          git reset --hard
          cp .dockerignore.auto .dockerignore
          podman-compose -f docker-compose.auto.yml down --remove-orphans || true
          podman rm -f laravel-app || true
          podman network rm main-laravel-vue_default || true

      - name: Build frontend assets
        run: npm run build

      - name: Build and start services
        run: |
          # podman image exists laravel-php-base:8.5-pgsql-v1 || podman build -f Dockerfile.base -t laravel-php-base:8.5-pgsql-v1 .
          podman rm -f laravel-app || true
          podman-compose -f docker-compose.auto.yml up --build -d

      - name: Debug port forwarding
        if: always()
        run: |
          podman ps -a --filter name=laravel-app || true
          podman port laravel-app || true
          ss -tlnp | grep -E '8080|rootlessport' || echo "no-8080-listener"
          ps aux | grep rootlessport | grep -v grep || true
          podman logs --tail=20 laravel-app || true

      - name: Cleanup old images
        if: always()
        run: |
          git reset --hard
          podman container prune -f || true
          podman image prune -f || true
          for i in 1 2 3 4 5; do
            ids=$(podman images -f dangling=true -q)
            echo "pass $i dangling: $ids"
            [ -z "$ids" ] && break
            for id in $ids; do podman rmi "$id" || echo "keep $id"; done
          done
          podman image ls -a || true
