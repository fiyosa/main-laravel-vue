# NOTE: podman/docker compose only reads `.dockerignore`.
# Before building with this file, swap it in:
#   cp .dockerignore.auto .dockerignore
# Then: podman compose -f docker-compose.auto.yml up --build -d
services:
  app:
    container_name: laravel-app
    build:
      context: .
      dockerfile: Dockerfile.auto
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - app-storage:/app/storage
    restart: unless-stopped

  queue:
    container_name: laravel-queue
    build:
      context: .
      dockerfile: Dockerfile.auto
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--timeout=90"]
    env_file:
      - .env
    volumes:
      - app-storage:/app/storage
    depends_on:
      - app
    restart: unless-stopped

  scheduler:
    container_name: laravel-scheduler
    build:
      context: .
      dockerfile: Dockerfile.auto
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    env_file:
      - .env
    volumes:
      - app-storage:/app/storage
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-storage:
